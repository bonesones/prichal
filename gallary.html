    <script>
      const gallary = document.querySelector(".gallary");
      const back = document.querySelector("#modal-background");
      back.style.display = `none`;

      const numberedImages = Array.from(
        document.querySelectorAll("img.img-gallary")
      );
      const numberBadges = numberedImages.map((img, index) => {
        const badge = document.createElement("span");
        badge.className = "img-num";
        badge.textContent = index + 1;
        document.body.appendChild(badge);
        return badge;
      });

      function positionNumberBadges() {
        numberedImages.forEach((img, index) => {
          const badge = numberBadges[index];
          const rect = img.getBoundingClientRect();

          if (!rect.width || !rect.height || img.classList.contains("opened")) {
            badge.style.display = "none";
            return;
          }

          badge.style.display = "block";
          badge.style.top = `${rect.top + window.scrollY + 8}px`;
          badge.style.left = `${rect.left + window.scrollX + 8}px`;
        });
      }

      numberedImages.forEach((img) => {
        img.addEventListener("load", positionNumberBadges);
      });
      window.addEventListener("load", positionNumberBadges);
      window.addEventListener("resize", positionNumberBadges);
      positionNumberBadges();

      if (document.documentElement.clientWidth > 999) {
        gallary.onclick = function (event) {
          const target = event.target;

          if (target.tagName === "IMG") {
            target.classList.add("opened");
            back.style.height = `${document.body.clientHeight}px`;
            back.style.display = `block`;
            positionNumberBadges();
          }
        };

        const closeBtn = document.querySelector("#close-btn");
        closeBtn.onclick = function () {
          let img = document.querySelector(".opened");
          img.classList.remove("opened");
          back.style.display = `none`;
          positionNumberBadges();
        };
      }
    </script>
